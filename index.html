<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Kart | QA Practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>E-Kart</h1>
    <p>My QA Practice Store</p>
  </header>

  <main>
    <h2>Products</h2>

    <label for="search">Search products</label>
    <input
      id="search"
      type="search"
      placeholder="Search by product name..."
    >

    <p id="result-count" aria-live="polite"></p>
    <section id="product-list" aria-label="Product list"></section>
  </main>
</body>
</html>
